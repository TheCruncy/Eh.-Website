<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kobold Simulator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Kobold simulator!!!</h1>
    <p>
      <span>Type in your name!</span>
      <span class="red">Warning: Once submitted, it cannot be changed!</span>
    </p>
    <div class="nameSelectBox">
      <input type="text" id="nameInput" />
      <input
        type="submit"
        value="Submit Name"
        id="nameSubmit"
        onclick="(hideActive(this), makeReadOnly(nameInput))"
      />
    </div>
    <p>
      <span>YOUR NAME IS: </span>
      <span id="output"></span>
    </p>

    <div class="day1">
      <p>You awaken in the cave, it's nice and quiet today.</p>
      <button id="continue" onclick="(hideActive(this), showDayOneText())">
        Continue
      </button>
      <div class="dayOneText" id="dayOneText">
        <p>You fall into a trap and die.</p>
        <p>The end.</p>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
